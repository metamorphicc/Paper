name: Encrypted database backup

on:
  workflow_dispatch:
  schedule:
    - cron: '41 3 * * *'

permissions:
  contents: read

concurrency:
  group: paperclub-database-backup
  cancel-in-progress: false

jobs:
  backup:
    if: vars.PAPERCLUB_OPERATIONS_ENABLED == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment: production-operations
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Export, encrypt and rehearse restoration in a separate scratch engine
        run: npm run database:backup:encrypted
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
      - name: Store authenticated encrypted backup
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: encrypted-database-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/backups/*.encrypted.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain verification report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backup-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/operations/backup.json
          if-no-files-found: ignore
          retention-days: 14

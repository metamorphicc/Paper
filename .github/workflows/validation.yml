name: Validate application

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck and format
        run: |
          npm run check
          npm run format:check
      - name: Accounting, protocol, contracts and persistent-storage tests
        run: npm test
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Compile production website
        run: npm run build
      - name: Check web types after Next generates its environment declarations
        run: npm run check:web
      - name: Install isolated test browser
        run: npx playwright install --with-deps chromium
      - name: Browser acceptance with isolated PostgreSQL and wallet fixtures
        run: npm run qa:browser
      - name: Retain generated browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/browser-qa/*.json
            data/browser-qa/*.jpg
          if-no-files-found: ignore
          retention-days: 7
